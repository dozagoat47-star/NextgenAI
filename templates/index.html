<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Nextgen AI - Sohbet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%; max-width: 600px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .header {
            background: linear-gradient(90deg, #667eea, #764ba2);
            padding: 20px; text-align: center;
        }
        .header h1 { color: white; font-size: 24px; font-weight: 600; }
        .header p { color: rgba(255,255,255,0.7); font-size: 12px; }
        .status-bar {
            display: flex; justify-content: center; gap: 20px;
            padding: 10px; background: rgba(0,0,0,0.2);
            font-size: 11px; color: rgba(255,255,255,0.6);
        }
        .status-bar span { display: flex; align-items: center; gap: 5px; }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #4ade80; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
        .chat-area {
            height: 400px; overflow-y: auto; padding: 20px; scroll-behavior: smooth;
        }
        .chat-area::-webkit-scrollbar { width: 6px; }
        .chat-area::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        .chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        .message { display: flex; margin-bottom: 15px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .message.user { justify-content: flex-end; }
        .message.ai { justify-content: flex-start; }
        .message-content {
            max-width: 75%; padding: 12px 16px; border-radius: 18px;
            font-size: 14px; line-height: 1.4;
        }
        .message.user .message-content {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white; border-bottom-right-radius: 4px;
        }
        .message.ai .message-content {
            background: rgba(255,255,255,0.1); color: white; border-bottom-left-radius: 4px;
        }
        .avatar {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; margin: 0 10px; flex-shrink: 0; color: white;
        }
        .message.user .avatar { order: 2; background: rgba(255,255,255,0.1); }
        .message.ai .avatar { background: linear-gradient(90deg, #667eea, #764ba2); }
        .typing-indicator {
            display: none; padding: 10px 20px;
            color: rgba(255,255,255,0.5); font-size: 13px; font-style: italic;
        }
        .typing-indicator.active { display: block; }
        .input-wrapper { position: relative; }
        .input-area {
            display: flex; padding: 15px; background: rgba(0,0,0,0.2); gap: 10px;
        }
        .input-area input {
            flex: 1; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 25px;
            padding: 12px 20px; color: white; font-size: 14px;
            outline: none; transition: all 0.3s;
        }
        .input-area input::placeholder { color: rgba(255,255,255,0.4); }
        .input-area input:focus { border-color: rgba(102,126,234,0.5); background: rgba(255,255,255,0.15); }
        .send-btn {
            background: linear-gradient(90deg, #667eea, #764ba2);
            border: none; border-radius: 50%; width: 45px; height: 45px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }
        .send-btn:hover { transform: scale(1.05); }
        .send-btn:active { transform: scale(0.95); }
        .send-btn svg { width: 20px; height: 20px; fill: white; }
        .welcome-message { text-align: center; color: rgba(255,255,255,0.6); padding: 40px 20px; }
        .welcome-message .icon { font-size: 48px; margin-bottom: 15px; }
        .welcome-message h2 { color: white; margin-bottom: 10px; font-size: 18px; }
        .welcome-message p { font-size: 13px; line-height: 1.6; }
        .suggestions {
            display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px;
        }
        .suggestion {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px; padding: 8px 15px; color: rgba(255,255,255,0.7);
            font-size: 12px; cursor: pointer; transition: all 0.2s;
        }
        .suggestion:hover { background: rgba(102,126,234,0.3); color: white; }
        .footer {
            text-align: center; padding: 15px; color: rgba(255,255,255,0.3);
            font-size: 11px; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .autocomplete {
            position: absolute; bottom: 100%; left: 0; right: 0;
            background: rgba(30,28,60,0.98); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; margin: 0 15px 5px;
            display: none; overflow: hidden; z-index: 10;
            backdrop-filter: blur(10px);
        }
        .autocomplete.active { display: block; }
        .autocomplete-item {
            padding: 10px 18px; color: rgba(255,255,255,0.8);
            font-size: 13px; cursor: pointer; transition: background 0.15s;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover, .autocomplete-item.selected {
            background: rgba(102,126,234,0.3); color: white;
        }
        .autocomplete-item span { color: rgba(255,255,255,0.4); font-size: 11px; margin-left: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Nextgen AI</h1>
            <p>Zero-to-One Neural Network</p>
        </div>
        <div class="status-bar">
            <span><div class="status-dot"></div> Online</span>
            <span id="vocab-size">Vocabulary: -</span>
            <span id="intent-count">Intents: -</span>
        </div>
        <div class="chat-area" id="chatArea">
            <div class="welcome-message" id="welcomeMsg">
                <div class="icon">&#x1F916;</div>
                <h2>Merhaba! Ben Nextgen AI</h2>
                <p>Python ile sifirda yapilmis bir yapay zekayim.<br>Seninle sohbet etmeyi sabirsizlikla bekliyorum!</p>
                <div class="suggestions">
                    <div class="suggestion" onclick="sendSuggestion('merhaba')">Merhaba</div>
                    <div class="suggestion" onclick="sendSuggestion('sen kimsin')">Sen kimsin?</div>
                    <div class="suggestion" onclick="sendSuggestion('espri yap')">Espri yap</div>
                    <div class="suggestion" onclick="sendSuggestion('film oner')">Film oner</div>
                </div>
            </div>
        </div>
        <div class="typing-indicator" id="typingIndicator">Nextgen dusunuyor...</div>
        <div class="input-wrapper">
            <div class="autocomplete" id="autocomplete"></div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="Mesajinizi yazin..." autocomplete="off">
                <button type="button" class="send-btn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
        <div class="footer">Built from scratch with NumPy &amp; Python</div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const typingIndicator = document.getElementById('typingIndicator');
        const welcomeMsg = document.getElementById('welcomeMsg');
        const autocompleteEl = document.getElementById('autocomplete');
        let selectedIdx = -1;
        let currentSuggestions = [];

        fetch('/status').then(r => r.json()).then(data => {
            document.getElementById('vocab-size').textContent = `Vocabulary: ${data.vocabulary_size}`;
            document.getElementById('intent-count').textContent = `Intents: ${data.intent_count}`;
        });

        function addMessage(text, isUser) {
            if (welcomeMsg) welcomeMsg.style.display = 'none';
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'ai'}`;
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = isUser ? 'You' : 'AI';
            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;
            div.appendChild(avatar);
            div.appendChild(content);
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function showAutocomplete(suggestions) {
            autocompleteEl.innerHTML = '';
            currentSuggestions = suggestions;
            selectedIdx = -1;
            if (suggestions.length === 0) {
                autocompleteEl.classList.remove('active');
                return;
            }
            suggestions.forEach((s, i) => {
                const item = document.createElement('div');
                item.className = 'autocomplete-item';
                item.textContent = s;
                item.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    userInput.value = s;
                    autocompleteEl.classList.remove('active');
                    sendMessage();
                });
                item.addEventListener('mouseenter', () => {
                    document.querySelectorAll('.autocomplete-item').forEach(el => el.classList.remove('selected'));
                    item.classList.add('selected');
                    selectedIdx = i;
                });
                autocompleteEl.appendChild(item);
            });
            autocompleteEl.classList.add('active');
        }

        function fetchPredictions(text) {
            if (text.length < 2) { autocompleteEl.classList.remove('active'); return; }
            fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            }).then(r => r.json()).then(data => {
                showAutocomplete(data.suggestions || []);
            }).catch(() => autocompleteEl.classList.remove('active'));
        }

        let debounceTimer;
        userInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => fetchPredictions(userInput.value.trim()), 200);
        });

        userInput.addEventListener('keydown', (e) => {
            if (!autocompleteEl.classList.contains('active')) {
                if (e.key === 'Enter') sendMessage();
                return;
            }
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                selectedIdx = Math.min(selectedIdx + 1, currentSuggestions.length - 1);
                updateSelected();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                selectedIdx = Math.max(selectedIdx - 1, 0);
                updateSelected();
            } else if (e.key === 'Enter' && selectedIdx >= 0) {
                e.preventDefault();
                userInput.value = currentSuggestions[selectedIdx];
                autocompleteEl.classList.remove('active');
                sendMessage();
            } else if (e.key === 'Escape') {
                autocompleteEl.classList.remove('active');
            } else if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function updateSelected() {
            document.querySelectorAll('.autocomplete-item').forEach((el, i) => {
                el.classList.toggle('selected', i === selectedIdx);
            });
        }

        userInput.addEventListener('blur', () => {
            setTimeout(() => autocompleteEl.classList.remove('active'), 150);
        });

        function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;
            autocompleteEl.classList.remove('active');
            addMessage(message, true);
            userInput.value = '';
            typingIndicator.classList.add('active');

            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            })
            .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
            .then(data => {
                typingIndicator.classList.remove('active');
                addMessage(data.response, false);
            })
            .catch(err => {
                typingIndicator.classList.remove('active');
                addMessage('Hata: ' + err.message + '. Sunucu calisiyor mu?', false);
            });
        }

        function sendSuggestion(text) {
            userInput.value = text;
            sendMessage();
        }

        userInput.focus();
    </script>
</body>
</html>
