name: Rebuild Knowledge Map

on:
  schedule:
    # Gunluk. knowledge_map.jsonl = intents desenleri -> corpus parcasi
    # eslesmesi; train_llm.py --kb-map ile modelin EGITIM VERISI.
    # AutoGrow (saatlik) intents'i buyutuyor ama bu eslesmeyi yeniden
    # uretmuyordu: knowledge_map 22.09'dan beri donmustu.
    - cron: '40 4 * * *'
  workflow_dispatch:

concurrency:
  # Diger yazicilarla ayni grup: intents.json / corpus.jsonl es zamanli
  # yazilirsa son yazan kazanir ve veri kaybi olur.
  group: main-writers
  cancel-in-progress: false

jobs:
  kbmap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests numpy

      # intents.json yanitlarini dogal varyantlarla zenginlestirir (idempotent)
      # ve bilgi desenlerini corpus'a baglayarak knowledge_map'i uretir.
      # Maliyet olcumu: corpus.load() 189 sn + 31.416 desen x 29.1 ms = ~18 dk.
      - name: Rebuild knowledge map
        run: python enrich_intents.py --k 3 --kb-limit 40000

      - name: Commit and push if changed
        run: |
          git config user.name "dozagoat47-star"
          git config user.email "dozagoat47-star@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "kbmap: bilgi desenleri yeniden korpusa baglandi [skip ci]"
            git pull --rebase origin main
            git push -q
            echo "knowledge_map guncellendi."
          else
            echo "No changes - knowledge_map up to date."
          fi
