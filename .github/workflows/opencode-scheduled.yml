name: opencode-scheduled

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */4 * * *"

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: groq/openai/gpt-oss-20b
          use_github_token: true
          prompt: |
            Sen otonom bir QA muhendisisin. Bu oturumda yapacaklarin:
            1. Nextgen AI kod tabanini incele (Flask + numpy sinir agi).
            2. Cok sayida Turkce mesajla chatbot'un /chat ve /predict endpointlerini test et.
            3. Tahmin, cevap secimi, tokenize, stemming hatalarini bul.
            4. Buldugun hatalari duzelt ve kod kalitesini iyilestir.
            5. Degisiklikleri kucuk net commit'ler halinde (Turkce mesajla) main dalina push et.
            6. Is bittiginde yaptiklarini ozetle.
            Tum token/istek limitine dikkat et: kucuk ve odakli adimlar at.
            Kendi entegrasyon testlerini calistir; her commit'ten once kodun hala calistigini dogrula.