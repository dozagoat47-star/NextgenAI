name: opencode-scheduled

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */4 * * *"

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@2.0
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: groq/llama-3.3-70b-versatile
          use_github_token: true
          prompt: |
            Sen otonom bir QA muhendisisin. Bu oturumda:
            1. Nextgen AI kod tabanini incele (Flask + numpy sinir agi).
            2. Turkce mesajlarla chatbot'un /chat ve /predict endpointlerini test et.
            3. Tahmin, cevap secimi, tokenize, stemming hatalarini bul.
            4. Buldugun hatalari duzelt.
            5. Yukaridaki isleri adim adim yap; her mantikli agamada KUCUK bir commit at (Turkce mesajla). Commit atmayi sona birakma, erken commit yap.
            6. Limit bilincinde calis: ayni oturumda bir isi bitirip commit edip digerine gec; rate limit gorursen bekleyip devam etme, mevcut isi bitir.
            7. Calisma baslar baslamaz once en kritik onemli bulguyu duzelt ve commit et.
            Ozet cikarmaya harcanan zaman sinirli; onceligin gercek commitler.