name: ChatGrow Feed

on:
  # Scheduled data collection is paused while the dataset is audited.
  workflow_dispatch:

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  chatgrow:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Discourse'u tara - zengin konular (order=posts)
        run: |
          python chatgrow.py --source discourse --order posts \
            --forum https://forum.pardus.org.tr \
            --limit 400 --merge --keep 800 \
            --out chatgrow_discourse_pardus.jsonl

      - name: Discourse'u tara - yeni basliklar (order=created)
        run: |
          python chatgrow.py --source discourse --order created \
            --forum https://forum.pardus.org.tr \
            --limit 1000 --merge --keep 2500 \
            --out chatgrow_discourse_pardus_yeni.jsonl

      - name: Commit and push if changed
        run: |
          git config user.name "dozagoat47-star"
          git config user.email "dozagoat47-star@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chatgrow: Discourse'ten yeni sohbet ciftleri eklendi [skip ci]"
            git pull --rebase origin main
            git push -q
            echo "New chats committed and pushed."
          else
            echo "No changes - chats are already up to date."
          fi
