name: ChatGrow Feed

on:
  schedule:
    # Günde 4 kez: 05:17 / 11:17 / 17:17 / 23:17 UTC
    - cron: '17 5,11,17,23 * * *'
  workflow_dispatch:

concurrency:
  group: chatgrow-feed
  cancel-in-progress: false

jobs:
  chatgrow:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Discourse'u tara (kimlik gerekmez)
        run: |
          python chatgrow.py --source discourse \
            --forum https://forum.pardus.org.tr \
            --limit 60 --out chatgrow_discourse_pardus.jsonl

      - name: Birleşik sohbet dosyasını güncelle
        run: |
          python chatgrow_birlesik.py chatgrow_discourse_pardus.jsonl \
            --fallback chatgrow_sohbet.jsonl \
            --out chatgrow_birlesik.jsonl

      - name: Commit and push if changed
        run: |
          git config user.name "dozagoat47-star"
          git config user.email "dozagoat47-star@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chatgrow: Discourse'ten yeni sohbet ciftleri eklendi [skip ci]"
            git pull --rebase origin main
            git push -q
            echo "New chats committed and pushed."
          else
            echo "No changes - chats are already up to date."
          fi
