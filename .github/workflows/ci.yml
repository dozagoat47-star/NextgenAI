name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy requests

      - name: Import smoke check
        run: |
          python -c "import brain, corpus, generator, seqgen"
          python -c "import clean_intents, scrape_intents, autogrow, train"

      - name: Run test suite
        run: python -m unittest discover -s tests -v