name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # flask sart: app.py sunucu dosyasi, test_app_status.py onu
        # import ediyor. flask kurulu degilken modul YUKLENEMIYOR ve
        # unittest.loader._FailedTest butun suite'i kirmizi ediyordu
        # (26.09'dan beri). Import smoke check'a da eklenmeli.
        run: pip install numpy requests flask

      - name: Cache corpus embeddings + index
        uses: actions/cache@v4
        with:
          path: |
            corpus_embedding.npz
            corpus_embedding_meta.json
            corpus_index.pkl
          key: corpus-${{ hashFiles('corpus.jsonl') }}-${{ hashFiles('corpus.py') }}

      - name: Import smoke check
        run: |
          python -c "import brain, corpus, generator, seqgen"
          python -c "import clean_intents, scrape_intents, autogrow, train"
          python -c "import app; print('[OK] app import edildi')"

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Veri dosyalarina dokunulmadi mi
        # 28.09: bir tam kosudan sonra corpus.jsonl 'M' cikti (+1 satir).
        # Suclu yol bulunamadi ve 3 kosudan sonra tekrarlamadi, ama "ara
        # sira oluyor" bir durum BIRAKILAMAZ: kirli agac sessizce bir
        # sonraki push'a girer. Testler bittikten SONRA git'e soruyoruz
        # (test sirasindan bagimsiz, tam kapsam).
        run: |
          if ! git diff --quiet -- corpus.jsonl corpus_ids.jsonl \
                                 intents.json knowledge_map.jsonl; then
            echo "::error::Test kosusu veri dosyasini degistirdi."
            git diff --stat -- corpus.jsonl corpus_ids.jsonl \
                                 intents.json knowledge_map.jsonl
            git diff -- corpus.jsonl corpus_ids.jsonl \
                         intents.json knowledge_map.jsonl | head -40
            exit 1
          fi
          echo "Veri dosyalari temiz."